# agnix configuration — agentkit template.
#
# agnix carries 445 sourced rules, each with source URLs and a verified_on date. It is the
# right tool for every check it already implements, and agentkit does not re-implement any
# of them. What agentkit adds is the residue: the handful of checks that exist in no
# catalogue, which live in kit/verify/residue.py.
#
# The severity overrides promote instruction-truncation and dead-reference findings to
# errors because they can disable repository guidance or enforcement.
#
# XP-009 uses the correct threshold. Its diagnostic may describe whole-file omission, while
# current Codex behavior can tail-truncate the first over-budget file before omitting later
# files.

extend = []
severity = "Warning"
exclude = [
  "node_modules/**",
  ".git/**",
  "target/**",
  # evidence, not instructions; never loaded, so not gated
  "docs/research/**",
  # RETIRED content. Linting it reports the old system's defects as the new one's, which is
  # how a successful migration reads as a failure. (Quarantine now lives outside the repo;
  # this entry covers migrations performed before that change.)
  ".agents/quarantine/**",
  # immutable ADRs and on-demand facts — prose records, zero startup cost, not instructions
  "docs/project/decisions/**",
  "docs/project/reference/**",
]
target = "Generic"
tools = []
overrides = []
max_files_to_validate = 10000

[rules]
skills = true
hooks = true
agents = true
memory = true
mcp = true
imports = true
cross_platform = true
agents_md = true
codex = true
frontmatter_validation = true
import_references = true
required_fields = true
tool_names = true
xml_balance = true
disabled_rules = []
disabled_validators = []

[rules.severity]
# Amputation vectors — each one makes the repo's own instructions vanish, silently.
CDX-003 = "Error" # AGENTS.override.md in version control: replaces AGENTS.md ENTIRELY
AGM-006 = "Error" # nested AGENTS.md: three incompatible semantics across three harnesses
XP-009 = "Error" # Codex chain over project_doc_max_bytes: the tail is cut in silence
CDX-AG-004 = "Error" # AGENTS.md over its size limit, same failure by another route

# Dead references to instruction imports and hook commands.
REF-001 = "Error" # an import that points at nothing
CC-HK-008 = "Error" # a hook command that does not exist is a gate that never fires

# Adherence, not safety: Anthropic publishes a target, not a cap. Warning is correct.
CC-MEM-014 = "Warning"

[tool_versions]

[spec_revisions]

[files]
include_as_memory = []
include_as_generic = []
exclude = []
