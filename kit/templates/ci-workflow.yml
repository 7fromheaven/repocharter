# RepoCharter conformance. Copy to .github/workflows/repocharter.yml
#
# This workflow detects violations after a push. It blocks merges only when the repository's
# branch-protection or ruleset configuration requires this job to pass.
#
# Note also that CI cannot see the machine-local half of the Claude-visible startup set:
# ~/.claude/CLAUDE.md, ancestor CLAUDE.md files, and — where explicitly enabled — MEMORY.md.
# Those
# are reported by `repocharter verify --effective` on a developer machine and are deliberately
# not gated here, because gating what CI cannot observe makes the budget a fiction.

name: repocharter

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: repocharter verify
        # --strict promotes warnings to errors. It can be omitted temporarily during a
        # migration and restored after the repository is conforming.
        run: |
          if [ ! -x kit/repocharter ]; then
            echo "::error::kit/repocharter is missing or not executable — the vendored kit is incomplete"
            exit 1
          fi
          kit/repocharter verify --repo . --strict

      - name: repocharter self-test
        # Proves the declared gates actually refuse. Without this, `enforcement: blocking`
        # in compatibility.json is a claim rather than a fact.
        run: kit/repocharter self-test --repo .

      - name: census (recorded, never gated)
        # Record context measurements without changing the job's pass/fail result.
        if: always()
        run: kit/repocharter census --repo . --json | tee census.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repocharter-census
          path: census.json
