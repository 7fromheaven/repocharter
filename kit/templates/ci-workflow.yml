# agentkit conformance. Copy to .github/workflows/agentkit.yml
#
# WHAT THIS CAN AND CANNOT DO, stated up front because the previous design got it wrong.
#
# On a personal GitHub plan with a private repository, branch protection and rulesets both
# return 403 "Upgrade to GitHub Pro or make this repository public to enable this feature".
# Verified live. Actions IS available and enabled, so this workflow is a DETECTOR that runs
# after the push it would have wanted to stop.
#
# That makes its job to be LOUD, not to be a fence. A genuine server-side block costs
# GitHub Pro, a self-hosted bare mirror with a pre-receive hook, or making the repo public.
#
# Note also that CI cannot see the machine-local half of the Claude-visible startup set:
# ~/.claude/CLAUDE.md, ancestor CLAUDE.md files, and MEMORY.md when auto memory is on. Those
# are reported by `agentkit verify --effective` on a developer machine and are deliberately
# not gated here, because gating what CI cannot observe makes the budget a fiction.

name: agentkit

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: agentkit verify
        # --strict promotes warnings to errors. Drop it during a migration and put it back
        # once the repo is clean, but do not leave it off: a gate people route around has
        # already failed.
        run: |
          if [ ! -x kit/agentkit ]; then
            echo "::error::kit/agentkit is missing or not executable — the vendored kit is incomplete"
            exit 1
          fi
          kit/agentkit verify --repo . --strict

      - name: agentkit self-test
        # Proves the declared gates actually refuse. Without this, `enforcement: blocking`
        # in compatibility.json is a claim rather than a fact.
        run: kit/agentkit self-test --repo .

      - name: census (recorded, never gated)
        # The before/after evidence. Not a pass/fail: a number nobody can act on should not
        # break a build, but a number nobody records cannot answer "did this help?".
        if: always()
        run: kit/agentkit census --repo . --json | tee census.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agentkit-census
          path: census.json
